<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{acc.newEntry})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('more')}"></header>
<main class="page" th:with="cur=' ' + ${config.currency}, canEdit=${@perm.edit('ACC_MANUAL')}">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="page-head"><div><h1 th:text="${entry == null} ? #{acc.newEntry} : ${entry.entryNo}">New entry</h1><p class="sub" th:text="#{acc.entrySub}">sub</p></div></div>
    <form class="panel" method="post" th:action="@{/accounting/entry}" id="je-form">
        <input type="hidden" name="id" th:if="${entry != null}" th:value="${entry.id}">
        <div class="form-row"><div class="field"><label for="date" th:text="#{t.date}">Date</label><input type="date" id="date" name="date" required th:value="${entry != null ? entry.entryDate : today}"></div>
            <div class="field wide"><label for="description" th:text="#{cash.description}">Description</label><input type="text" id="description" name="description" maxlength="300" required th:value="${entry?.description}"></div></div>
        <div class="table-wrap"><table class="data" id="je-table">
            <thead><tr><th th:text="#{acc.account}">Account</th><th th:text="#{acc.debit}">Debit</th><th th:text="#{acc.credit}">Credit</th><th th:text="#{t.note}">Note</th></tr></thead>
            <tbody>
            <tr th:each="i : ${#numbers.sequence(0, 7)}" th:with="l=${entry != null and i < #lists.size(entry.lines) ? entry.lines[i] : null}">
                <td><select name="acct"><option value="">–</option>
                    <option th:each="a : ${accounts}" th:value="${a.id}" th:selected="${l != null and l.account.id == a.id}" th:text="${a.code} + ' ' + ${a.name}">a</option></select></td>
                <td><input type="number" class="qty-small wide-num je-dr" name="dr" step="0.01" min="0" th:value="${l != null and l.debit.signum() > 0 ? l.debit : ''}"></td>
                <td><input type="number" class="qty-small wide-num je-cr" name="cr" step="0.01" min="0" th:value="${l != null and l.credit.signum() > 0 ? l.credit : ''}"></td>
                <td><input type="text" name="note" maxlength="200" th:value="${l?.note}"></td></tr>
            </tbody>
            <tfoot><tr><td th:text="#{t.total}">Total</td><td id="je-dr">0.00</td><td id="je-cr">0.00</td><td id="je-diff"></td></tr></tfoot>
        </table></div>
        <div class="form-actions"><button class="btn" type="submit" th:text="#{t.save}">Save</button><a class="btn ghost" th:href="@{/accounting}" th:text="#{t.cancel}">Cancel</a>
            <span class="hint" th:text="#{acc.balanceHint}">Debits must equal credits.</span></div>
    </form>
</main>
<script th:replace="~{fragments/layout :: menu-script}"></script>
<script th:src="@{/js/common.js}"></script>
<script th:inline="javascript">
    (function () {
        var off = /*[[#{acc.difference}]]*/ 'Difference';
        function sum(cls) { var s = 0; document.querySelectorAll('.' + cls).forEach(function (i) { s += parseFloat(i.value || 0) || 0; }); return s; }
        function upd() {
            var d = sum('je-dr'), c = sum('je-cr');
            document.getElementById('je-dr').textContent = d.toFixed(2);
            document.getElementById('je-cr').textContent = c.toFixed(2);
            var diff = Math.round((d - c) * 100) / 100;
            var el = document.getElementById('je-diff');
            el.textContent = diff === 0 ? '✓' : off + ': ' + diff.toFixed(2);
            el.className = diff === 0 ? 'pos' : 'neg';
        }
        document.getElementById('je-table').addEventListener('input', upd);
        upd();
    })();
</script>
</body>
</html>
