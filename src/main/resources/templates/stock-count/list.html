<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{sc.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('reports')}"></header>
<main class="page" th:with="cur=' ' + ${config.currency}">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="page-head"><div><h1 th:text="#{sc.title}">Stock count</h1><p class="sub" th:text="#{sc.sub}">sub</p></div></div>
    <form class="panel cc-bar" method="post" th:action="@{/stock-count}" th:if="${@perm.edit('STOCK')}">
        <label for="note" th:text="#{sc.new}">New count</label>
        <input type="text" id="note" name="note" maxlength="300" th:placeholder="#{sc.noteHint}">
        <button class="btn accent" type="submit" th:text="#{sc.start}">Start</button>
    </form>
    <div class="table-wrap"><table class="data">
        <thead><tr><th th:text="#{pd.no}">No</th><th th:text="#{t.date}">Date</th><th th:text="#{t.note}">Note</th><th th:text="#{t.status}">Status</th><th th:text="#{t.user}">User</th></tr></thead>
        <tbody><tr th:each="c : ${counts}" class="clickable" th:attr="data-href=@{/stock-count/{x}(x=${c.code})}">
            <td><b th:text="${c.code}">SC-00001</b></td><td th:text="${#temporals.format(c.countedOn, 'dd/MM/yyyy')}">d</td><td th:text="${c.note}">n</td>
            <td><span class="tag" th:classappend="${c.status == 'APPLIED'} ? 'pay-paid' : (${c.status == 'OPEN'} ? 'pay-partly' : 'pay-overdue')" th:text="#{sc.status.__${c.status}__}">Open</span></td>
            <td th:text="${c.createdBy}">u</td></tr></tbody>
    </table><div class="empty" th:if="${#lists.isEmpty(counts)}" th:text="#{sc.none}">No stock counts yet.</div></div>
</main>
<script th:replace="~{fragments/layout :: menu-script}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
