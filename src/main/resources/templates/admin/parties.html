<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{kind.__${kind.name()}__.many})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('admin')}"></header>
<main class="page">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="page-head">
        <div>
            <h1 th:text="#{kind.__${kind.name()}__.many}">Clients</h1>
            <p class="sub" th:text="#{admin.registered(${#lists.size(items)})}">0 registered</p>
        </div>
        <a class="btn accent" th:href="@{/admin/{k}/new(k=${kind.path})}" th:text="#{kind.__${kind.name()}__.add}">Add client</a>
    </div>
    <div class="table-wrap">
        <table class="data">
            <thead><tr><th><th:block th:text="#{t.name}">Name</th:block></th><th><th:block th:text="#{t.tin}">TIN</th:block></th><th><th:block th:text="#{t.address}">Address</th:block></th><th><th:block th:text="#{t.email}">Email</th:block></th><th><th:block th:text="#{t.phone}">Phone</th:block></th><th><th:block th:text="#{t.registered}">Registered</th:block></th><th><span class="visually-hidden"><th:block th:text="#{t.actions}">Actions</th:block></span></th></tr></thead>
            <tbody>
            <tr th:each="p : ${items}" class="clickable" th:attr="data-href=@{/admin/{k}/{id}(k=${kind.path},id=${p.id})}">
                <td><a th:href="@{/admin/{k}/{id}(k=${kind.path},id=${p.id})}" th:text="${p.name}">Name</a></td>
                <td th:text="${p.tin}">TIN</td>
                <td th:text="${p.address}">Address</td>
                <td th:text="${p.email}">Email</td>
                <td th:text="${p.phone}">Phone</td>
                <td th:text="${#temporals.format(p.registeredAt, 'dd/MM/yyyy')}">date</td>
                <td>
                    <form class="inline" method="post" th:action="@{/admin/{k}/{id}/delete(k=${kind.path},id=${p.id})}"
                          th:attr="data-confirm=#{admin.deleteKeepName(${p.name})}">
                        <button class="btn danger small" type="submit"><img class="ico" th:src="@{/img/delete.png}" alt=""><th:block th:text="#{t.delete}">Delete</th:block></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty" th:if="${#lists.isEmpty(items)}" th:text="#{kind.__${kind.name()}__.none}">None yet.</div>
    </div>
</main>
<script th:replace="~{fragments/layout :: menu-script}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
