<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{as.rep})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('assets')}"></header>
<main class="page">
    <div class="page-head"><div><h1 th:text="#{as.rep}">Title</h1><p class="sub" th:text="#{as.repSub}">sub</p></div>
        <button class="btn ghost" type="button" onclick="window.print()" th:text="#{t.print}">Print</button></div>
    <form class="filters no-print" method="get" th:action="@{/assets/report}">
        <div class="field"><label for="from" th:text="#{t.from}">From</label><input type="date" id="from" name="from" th:value="${from}"></div>
        <div class="field"><label for="to" th:text="#{t.to}">To</label><input type="date" id="to" name="to" th:value="${to}"></div>
        <button class="btn" type="submit" th:text="#{t.show}">Show</button>
    </form>
    <div class="table-wrap"><table class="data compact">
        <thead><tr><th rowspan="2" th:text="#{as.category}">Category</th><th colspan="4" th:text="#{as.cost}">Cost</th><th colspan="4" th:text="#{as.accumulated}">Accumulated depreciation</th><th colspan="2" th:text="#{as.bookValue}">Book value</th></tr>
            <tr><th th:text="#{as.start}">Start</th><th th:text="#{as.additions}">+ Acquisitions</th><th th:text="#{as.out}">− Disposals</th><th th:text="#{as.end}">End</th>
                <th th:text="#{as.start}">Start</th><th th:text="#{as.depPeriod}">+ Depreciation</th><th th:text="#{as.out}">− Disposals</th><th th:text="#{as.end}">End</th>
                <th th:text="#{as.start}">Start</th><th th:text="#{as.end}">End</th></tr></thead>
        <tbody><tr th:each="m : ${rows}"><td><b th:text="${m.category()}">c</b></td>
            <td class="num" th:text="${#numbers.formatDecimal(m.costStart(), 1, 'COMMA', 0, 'POINT')}">0</td><td class="num" th:text="${#numbers.formatDecimal(m.additions(), 1, 'COMMA', 0, 'POINT')}">0</td><td class="num" th:text="${#numbers.formatDecimal(m.disposals(), 1, 'COMMA', 0, 'POINT')}">0</td><td class="num"><b th:text="${#numbers.formatDecimal(m.costEnd(), 1, 'COMMA', 0, 'POINT')}">0</b></td>
            <td class="num" th:text="${#numbers.formatDecimal(m.accStart(), 1, 'COMMA', 0, 'POINT')}">0</td><td class="num" th:text="${#numbers.formatDecimal(m.depreciation(), 1, 'COMMA', 0, 'POINT')}">0</td><td class="num" th:text="${#numbers.formatDecimal(m.accDisposed(), 1, 'COMMA', 0, 'POINT')}">0</td><td class="num"><b th:text="${#numbers.formatDecimal(m.accEnd(), 1, 'COMMA', 0, 'POINT')}">0</b></td>
            <td class="num" th:text="${#numbers.formatDecimal(m.bookStart(), 1, 'COMMA', 0, 'POINT')}">0</td><td class="num"><b th:text="${#numbers.formatDecimal(m.bookEnd(), 1, 'COMMA', 0, 'POINT')}">0</b></td></tr></tbody>
        <tfoot><tr><td th:text="#{t.total}">Total</td>
            <td class="num" th:each="f : ${ {'costStart','additions','disposals','costEnd','accStart','depreciation','accDisposed','accEnd','bookStart','bookEnd'} }"
                th:text="${#numbers.formatDecimal(#aggregates.sum(rows.![__${f}__()]), 1, 'COMMA', 0, 'POINT')}">0</td></tr></tfoot>
    </table><div class="empty" th:if="${#lists.isEmpty(rows)}" th:text="#{as.none}">Nothing in this period.</div></div>
    <p class="hint" th:text="#{as.repHint}">hint</p>
</main>
<script th:replace="~{fragments/layout :: menu-script}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
