<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{as.disp})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('assets')}"></header>
<main class="page">
    <div class="page-head"><div><h1 th:text="#{as.disp}">Title</h1><p class="sub" th:text="#{as.dispSub}">sub</p></div>
        <button class="btn ghost" type="button" onclick="window.print()" th:text="#{t.print}">Print</button></div>
    <form class="filters no-print" method="get" th:action="@{/assets/disposals}">
        <div class="field"><label for="from" th:text="#{t.from}">From</label><input type="date" id="from" name="from" th:value="${from}"></div>
        <div class="field"><label for="to" th:text="#{t.to}">To</label><input type="date" id="to" name="to" th:value="${to}"></div>
        <button class="btn" type="submit" th:text="#{t.show}">Show</button>
    </form>
    <div class="table-wrap"><table class="data">
        <thead><tr><th th:text="#{t.code}">Code</th><th th:text="#{t.name}">Name</th><th th:text="#{t.date}">Date</th><th th:text="#{as.cost}">Cost</th><th th:text="#{as.accumulated}">Accumulated</th>
            <th th:text="#{as.bookValue}">Book value</th><th th:text="#{as.soldFor}">Sold for</th><th th:text="#{as.gainLoss}">Gain / loss</th></tr></thead>
        <tbody><tr th:each="d : ${rows}"><td><a th:href="@{/assets/{id}(id=${d.asset().id})}" th:text="${d.asset().code}">A1</a></td><td th:text="${d.asset().name}">n</td>
            <td th:text="${#temporals.format(d.asset().disposalDate, 'dd/MM/yyyy')}">d</td><td class="num" th:text="${#numbers.formatDecimal(d.cost(), 1, 'COMMA', 0, 'POINT')}">0</td><td class="num" th:text="${#numbers.formatDecimal(d.accumulated(), 1, 'COMMA', 0, 'POINT')}">0</td>
            <td class="num" th:text="${#numbers.formatDecimal(d.bookValue(), 1, 'COMMA', 0, 'POINT')}">0</td><td class="num" th:text="${#numbers.formatDecimal(d.value(), 1, 'COMMA', 0, 'POINT')}">0</td>
            <td class="num" th:classappend="${d.gainLoss().signum() < 0} ? 'neg' : 'pos'" th:text="${#numbers.formatDecimal(d.gainLoss(), 1, 'COMMA', 0, 'POINT')}">0</td></tr></tbody>
    </table><div class="empty" th:if="${#lists.isEmpty(rows)}" th:text="#{as.none}">Nothing in this period.</div></div>
    <p class="hint" th:text="#{as.dispHint}">Dispose an asset from its page in the register.</p>
</main>
<script th:replace="~{fragments/layout :: menu-script}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
