<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{as.dep})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('assets')}"></header>
<main class="page">
    <div class="page-head"><div><h1 th:text="#{as.dep}">Title</h1><p class="sub" th:text="#{as.depSub}">sub</p></div>
        <button class="btn ghost" type="button" onclick="window.print()" th:text="#{t.print}">Print</button></div>
    <form class="filters no-print" method="get" th:action="@{/assets/depreciation}">
        <div class="field"><label for="year" th:text="#{fs.year}">Year</label><input type="number" id="year" name="year" min="2000" max="2100" th:value="${year}" class="qty-small"></div>
        <button class="btn" type="submit" th:text="#{t.show}">Show</button>
    </form>
    <div class="table-wrap"><table class="data compact">
        <thead><tr><th th:text="#{t.name}">Asset</th><th th:each="m : ${#numbers.sequence(1, 12)}" th:text="${m}">1</th><th th:text="#{t.total}">Total</th></tr></thead>
        <tbody><tr th:each="r : ${rows}"><td><a th:href="@{/assets/{id}(id=${r.asset().id})}" th:text="${r.asset().code} + ' ' + ${r.asset().name}">A1</a></td>
            <td class="num" th:each="v : ${r.months()}" th:text="${v.signum() == 0} ? '' : ${#numbers.formatDecimal(v, 1, 'COMMA', 0, 'POINT')}">0</td><td class="num"><b th:text="${#numbers.formatDecimal(r.total(), 1, 'COMMA', 0, 'POINT')}">0</b></td></tr></tbody>
        <tfoot><tr><td th:text="#{t.total}">Total</td><td class="num" th:each="i : ${#numbers.sequence(0, 11)}" th:text="${#numbers.formatDecimal(#aggregates.sum(rows.![months()[__${i}__]]), 1, 'COMMA', 0, 'POINT')}">0</td>
            <td class="num amt-total" th:text="${#numbers.formatDecimal(#aggregates.sum(rows.![total()]), 1, 'COMMA', 0, 'POINT')}">0</td></tr></tfoot>
    </table><div class="empty" th:if="${#lists.isEmpty(rows)}" th:text="#{as.none}">No depreciation in this year.</div></div>
    <p class="hint" th:text="#{as.depHint}">hint</p>
</main>
<script th:replace="~{fragments/layout :: menu-script}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
