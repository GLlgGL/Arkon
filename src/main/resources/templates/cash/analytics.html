<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{cash.tab.analytics})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('cash')}"></header>
<main class="page" th:with="cur=' ' + ${config.currency}">
    <div class="page-head"><div><h1 th:text="#{cash.tab.analytics}">Analytics</h1><p class="sub" th:text="#{cash.analyticsSub}">Comparisons.</p></div></div>

    <form class="filters" method="get" th:action="@{/cash/analytics}">
        <div class="field"><label for="month" th:text="#{cash.month}">Month</label><input type="month" id="month" name="month" th:value="${month}"></div>
        <div class="field"><label for="base" th:text="#{cash.compareWith}">Compare with</label>
            <select id="base" name="base">
                <option value="prev" th:selected="${base == 'prev'}" th:text="#{cash.cmpPrev}">Previous month</option>
                <option value="lastYear" th:selected="${base == 'lastYear'}" th:text="#{cash.cmpLastYear}">Same month last year</option></select></div>
        <button class="btn" type="submit" th:text="#{t.show}">Show</button>
    </form>

    <th:block th:each="cmp, it : ${ {monthCmp, yearCmp} }">
    <h2 class="section-title" th:text="${it.first} ? #{cash.cmpMonthTitle} : #{cash.cmpYearTitle}">Comparison</h2>
    <p class="sub" th:text="#{cash.cmpPeriods(${#temporals.format(cmp.fromA(), 'dd/MM/yyyy')}, ${#temporals.format(cmp.toA(), 'dd/MM/yyyy')}, ${#temporals.format(cmp.fromB(), 'dd/MM/yyyy')}, ${#temporals.format(cmp.toB(), 'dd/MM/yyyy')})}">periods</p>
    <div class="cmp-cards">
        <div class="cmp-card" th:each="k : ${ {'in','out','net'} }"
             th:with="a=${k == 'in' ? cmp.inA() : (k == 'out' ? cmp.outA() : cmp.netA())},
                      b=${k == 'in' ? cmp.inB() : (k == 'out' ? cmp.outB() : cmp.netB())},
                      p=${k == 'in' ? cmp.inPct() : (k == 'out' ? cmp.outPct() : cmp.netPct())},
                      good=${p != null and (k == 'out' ? p.signum() < 0 : p.signum() > 0)}">
            <span class="cmp-label" th:text="#{cash.__${k}__}">In</span>
            <b th:text="${#numbers.formatDecimal(a, 1, 'COMMA', 2, 'POINT')} + ${cur}">0</b>
            <span class="cmp-prev" th:text="#{cash.was(${#numbers.formatDecimal(b, 1, 'COMMA', 2, 'POINT')} + ${cur})}">was</span>
            <span class="cmp-pct" th:if="${p != null}" th:classappend="${good} ? 'up-good' : 'up-bad'"
                  th:text="(${p.signum() > 0} ? '▲ +' : (${p.signum() < 0} ? '▼ ' : '')) + ${p} + '%'">+5%</span>
            <span class="cmp-pct muted" th:if="${p == null}" th:text="#{cash.noBasis}">–</span>
        </div>
    </div>
    <div class="table-wrap" th:unless="${#lists.isEmpty(cmp.rows())}">
        <table class="data">
            <thead><tr><th th:text="#{cash.category}">Category</th><th th:text="#{cash.periodA}">This period</th><th th:text="#{cash.periodB}">Compared with</th>
                <th th:text="#{cash.difference}">Difference</th><th>%</th></tr></thead>
            <tbody><tr th:each="r : ${cmp.rows()}">
                <td><span class="dir-dot" th:classappend="${r.category().isIn()} ? 'in' : 'out'"></span><th:block th:text="#{cash.cat.__${r.category().name()}__}">c</th:block></td>
                <td th:text="${#numbers.formatDecimal(r.a(), 1, 'COMMA', 2, 'POINT')}">0</td>
                <td th:text="${#numbers.formatDecimal(r.b(), 1, 'COMMA', 2, 'POINT')}">0</td>
                <td th:classappend="${r.diff().signum() < 0} ? 'neg' : 'pos'" th:text="${#numbers.formatDecimal(r.diff(), 1, 'COMMA', 2, 'POINT')}">0</td>
                <td th:text="${r.pct() != null} ? ${r.pct()} + '%' : '–'">%</td></tr></tbody>
        </table>
    </div>
    </th:block>

    <h2 class="section-title" th:text="#{cash.last12}">Last 12 months</h2>
    <div class="charts">
        <section class="chart-card wide"><h2 th:text="#{cash.chartInOut}">Money in and out, compared with the year before</h2>
            <div class="chart-box tall"><canvas id="chart-inout"></canvas></div></section>
        <section class="chart-card"><h2 th:text="#{cash.chartNet}">Net result per month</h2>
            <div class="chart-box"><canvas id="chart-net"></canvas></div></section>
        <section class="chart-card"><h2 th:text="#{cash.chartBalance}">Total balance at month end</h2>
            <div class="chart-box"><canvas id="chart-balance"></canvas></div></section>
    </div>
</main>
<script th:replace="~{fragments/layout :: menu-script}"></script>
<script th:src="@{/js/vendor/chart-4.4.1.umd.min.js}"></script>
<script th:inline="javascript">
    (function () {
        var m = /*[[${monthly}]]*/ {};
        var T = window.T || function (k) { return k; };
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        Chart.defaults.color = dark ? '#d5dde6' : '#1d2733';
        Chart.defaults.borderColor = dark ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.10)';
        var opts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } };
        new Chart(document.getElementById('chart-inout'), { type: 'bar', options: opts, data: { labels: m.labels, datasets: [
            { label: T('cashIn'), data: m['in'], backgroundColor: '#3ba834' },
            { label: T('cashInPrev'), data: m.inPrev, backgroundColor: 'rgba(59,168,52,.35)' },
            { label: T('cashOut'), data: m.out, backgroundColor: '#d32f2f' },
            { label: T('cashOutPrev'), data: m.outPrev, backgroundColor: 'rgba(211,47,47,.35)' }] } });
        new Chart(document.getElementById('chart-net'), { type: 'line', options: opts, data: { labels: m.labels, datasets: [
            { label: T('cashNet'), data: m.net, borderColor: '#0b4779', backgroundColor: '#0b4779', tension: .25 },
            { label: T('cashNetPrev'), data: m.netPrev, borderColor: '#9aa5b1', backgroundColor: '#9aa5b1', borderDash: [6, 4], tension: .25 }] } });
        new Chart(document.getElementById('chart-balance'), { type: 'line', options: opts, data: { labels: m.labels, datasets: [
            { label: T('cashBalance'), data: m.balance, borderColor: '#ffa100', backgroundColor: 'rgba(255,161,0,.15)', fill: true, tension: .25 }] } });
    })();
</script>
</body>
</html>
