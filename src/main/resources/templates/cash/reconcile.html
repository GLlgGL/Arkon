<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{cash.reconcile})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('cash')}"></header>
<main class="page" th:with="cur=' ' + ${config.currency}">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="page-head"><div><h1 th:text="#{cash.reconcile}">Reconcile</h1><p class="sub" th:text="#{cash.reconcileHint}">hint</p></div></div>
    <nav th:replace="~{cash/_tabs :: tabs('overview')}"></nav>
    <form class="panel narrow" method="post" th:action="@{/cash/reconcile}" th:attr="data-confirm=#{cash.reconcileConfirm}">
        <div class="form-row">
            <div class="field"><label for="accountId" th:text="#{cash.account}">Account</label>
                <select id="accountId" name="accountId" required>
                    <option th:each="b : ${balances}" th:if="${b.account().active}" th:value="${b.account().id}" th:selected="${b.account().id == selected}"
                            th:text="${b.account().name} + ' (IMS: ' + ${#numbers.formatDecimal(b.balance(), 1, 'COMMA', 2, 'POINT')} + ${cur} + ')'">Arka</option>
                </select></div>
            <div class="field"><label for="date" th:text="#{t.date}">Date</label><input type="date" id="date" name="date" th:value="${today}" required></div>
        </div>
        <div class="form-row">
            <div class="field"><label for="counted" th:text="#{cash.counted}">Counted / statement balance</label>
                <input type="number" id="counted" name="counted" step="0.01" required></div>
            <div class="field wide"><label for="note" th:text="#{t.note}">Note</label>
                <input type="text" id="note" name="note" maxlength="200" th:placeholder="#{cash.reconcileNote}"></div>
        </div>
        <div class="form-actions">
            <button class="btn accent" type="submit" th:text="#{cash.reconcile}">Reconcile</button>
            <a class="btn ghost" th:href="@{/cash}" th:text="#{t.cancel}">Cancel</a>
        </div>
    </form>
</main>
<script th:replace="~{fragments/layout :: menu-script}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
