<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{nav.ccReport})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('reports')}"></header>
<main class="page" th:with="R=${report}, cur=' ' + ${config.currency}">
    <div class="page-head"><div><h1 th:text="#{nav.ccReport}">Cost centre report</h1>
        <p class="sub" th:text="#{cc.reportSub(${#temporals.format(R.prevFrom(), 'dd/MM/yyyy')}, ${#temporals.format(R.prevTo(), 'dd/MM/yyyy')})}">sub</p></div>
        <a class="btn ghost" th:href="@{/cost-centers}" th:text="#{nav.cc}">Cost centres</a></div>
    <form class="filters" method="get" th:action="@{/cost-centers/report}">
        <div class="field"><label for="from" th:text="#{t.from}">From</label><input type="date" id="from" name="from" th:value="${from}"></div>
        <div class="field"><label for="to" th:text="#{t.to}">To</label><input type="date" id="to" name="to" th:value="${to}"></div>
        <button class="btn" type="submit" th:text="#{t.show}">Show</button>
    </form>
    <div class="table-wrap">
        <table class="data">
            <thead><tr><th th:text="#{cc.costCenter}">Cost centre</th><th th:text="#{cc.revenue}">Revenue</th><th th:text="#{cc.cogs}">Cost of goods</th>
                <th th:text="#{cc.gross}">Gross profit</th><th th:text="#{cc.purchases}">Purchases</th><th th:text="#{cc.otherIncome}">Other income</th>
                <th th:text="#{cc.expenses}">Expenses</th><th th:text="#{cc.result}">Result</th><th th:text="#{cc.prevResult}">Previous period</th><th>%</th></tr></thead>
            <tbody><tr th:each="r : ${R.rows()}">
                <td><b th:text="${r.center() != null} ? ${r.center().label} : #{cc.unassigned}">CC</b></td>
                <td th:text="${#numbers.formatDecimal(r.revenue(), 1, 'COMMA', 2, 'POINT')}">0</td>
                <td th:text="${#numbers.formatDecimal(r.cogs(), 1, 'COMMA', 2, 'POINT')}">0</td>
                <td th:text="${#numbers.formatDecimal(r.grossProfit(), 1, 'COMMA', 2, 'POINT')}">0</td>
                <td th:text="${#numbers.formatDecimal(r.purchases(), 1, 'COMMA', 2, 'POINT')}">0</td>
                <td th:text="${#numbers.formatDecimal(r.otherIncome(), 1, 'COMMA', 2, 'POINT')}">0</td>
                <td th:text="${#numbers.formatDecimal(r.expenses(), 1, 'COMMA', 2, 'POINT')}">0</td>
                <td th:classappend="${r.result().signum() < 0} ? 'neg' : 'pos'"><b th:text="${#numbers.formatDecimal(r.result(), 1, 'COMMA', 2, 'POINT')}">0</b></td>
                <td th:text="${#numbers.formatDecimal(r.resultPrev(), 1, 'COMMA', 2, 'POINT')}">0</td>
                <td th:text="${r.resultPct() != null} ? ${r.resultPct()} + '%' : '–'">%</td>
            </tr></tbody>
            <tfoot><tr th:with="r=${R.total()}"><td th:text="#{t.total}">Total</td>
                <td th:text="${#numbers.formatDecimal(r.revenue(), 1, 'COMMA', 2, 'POINT')}">0</td>
                <td th:text="${#numbers.formatDecimal(r.cogs(), 1, 'COMMA', 2, 'POINT')}">0</td>
                <td th:text="${#numbers.formatDecimal(r.grossProfit(), 1, 'COMMA', 2, 'POINT')}">0</td>
                <td th:text="${#numbers.formatDecimal(r.purchases(), 1, 'COMMA', 2, 'POINT')}">0</td>
                <td th:text="${#numbers.formatDecimal(r.otherIncome(), 1, 'COMMA', 2, 'POINT')}">0</td>
                <td th:text="${#numbers.formatDecimal(r.expenses(), 1, 'COMMA', 2, 'POINT')}">0</td>
                <td class="amt-total" th:text="${#numbers.formatDecimal(r.result(), 1, 'COMMA', 2, 'POINT')} + ${cur}">0</td>
                <td th:text="${#numbers.formatDecimal(r.resultPrev(), 1, 'COMMA', 2, 'POINT')}">0</td>
                <td th:text="${r.resultPct() != null} ? ${r.resultPct()} + '%' : '–'">%</td></tr></tfoot>
        </table>
        <div class="empty" th:if="${#lists.isEmpty(R.rows())}" th:text="#{cc.noData}">No data in this period.</div>
    </div>
    <p class="hint" th:text="#{cc.howHint}">hint</p>
</main>
<script th:replace="~{fragments/layout :: menu-script}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
