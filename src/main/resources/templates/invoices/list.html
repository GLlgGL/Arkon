<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(#{nav.invoices.__${type.path}__})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('invoices')}"></header>
<main class="page">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="page-head" id="live-head" data-live-region>
        <div>
            <h1 th:text="#{nav.invoices.__${type.path}__}">Sale invoices</h1>
            <p class="sub" th:text="#{invoices.count(${#lists.size(files)})}">0 invoices</p>
        </div>
    </div>

    <form class="filters" method="get" data-live-search th:action="@{/invoices/{p}(p=${type.path})}">
        <div class="field">
            <label for="q"><th:block th:text="#{t.search_file_names}">Search file names</th:block></label>
            <input type="search" id="q" name="q" th:value="${q}" th:placeholder="#{t.name_date_or_order_no}">
        </div>
        <button class="btn" type="submit"><th:block th:text="#{t.search}">Search</th:block></button>
        <a class="btn ghost" th:if="${q}" th:href="@{/invoices/{p}(p=${type.path})}"><th:block th:text="#{t.clear}">Clear</th:block></a>
    </form>

    <div class="table-wrap" id="live-table" data-live-region>
        <table class="data">
            <thead>
            <tr><th><th:block th:text="#{t.file}">File</th:block></th><th><th:block th:text="#{t.created}">Created</th:block></th><th class="num"><th:block th:text="#{t.size}">Size</th:block></th><th><span class="visually-hidden"><th:block th:text="#{t.actions}">Actions</th:block></span></th></tr>
            </thead>
            <tbody>
            <tr th:each="f : ${files}">
                <td><img class="ico" th:src="@{/img/pdf-file.png}" alt=""><a th:href="@{/invoices/{p}/file(p=${type.path},name=${f.name()})}" target="_blank" rel="noopener" th:text="${f.name()}">file.pdf</a></td>
                <td th:text="${#temporals.format(f.modifiedAt(), 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                <td class="num" th:text="${f.size() / 1024} + ' KB'">10 KB</td>
                <td>
                    <div class="actions">
                        <a class="btn ghost small" th:href="@{/invoices/{p}/file(p=${type.path},name=${f.name()},download='1')}"><img class="ico" th:src="@{/img/download.png}" alt=""><th:block th:text="#{t.download}">Download</th:block></a>
                        <form sec:authorize="hasRole('ADMIN')" class="inline" method="post"
                              th:action="@{/invoices/{p}/delete(p=${type.path})}"
                              th:attr="data-confirm=#{invoices.deleteConfirm(${f.name()})}">
                            <input type="hidden" name="name" th:value="${f.name()}">
                            <button class="btn danger small" type="submit"><img class="ico" th:src="@{/img/delete.png}" alt=""><th:block th:text="#{t.delete}">Delete</th:block></button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty" th:if="${#lists.isEmpty(files)}">
            <span th:if="${q}"><th:block th:text="#{t.no_invoice_file_names_match_this_search}">No invoice file names match this search.</th:block></span>
            <span th:unless="${q}"><th:block th:text="#{t.no_invoices_yet_open_an_order_and_select_create_}">No invoices yet. Open an order and select Create invoice.</th:block></span>
        </div>
    </div>
</main>
<script th:replace="~{fragments/layout :: menu-script}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
