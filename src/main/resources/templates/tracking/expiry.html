<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{trk.expiryTitle})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('reports')}"></header>
<main class="page">
    <div class="page-head"><div><h1 th:text="#{trk.expiryTitle}">Expiry report</h1><p class="sub" th:text="#{trk.expirySub}">sub</p></div>
        <button class="btn ghost" type="button" onclick="window.print()" th:text="#{t.print}">Print</button></div>
    <form class="filters no-print" method="get" th:action="@{/tracking/expiry}">
        <div class="field"><label for="days" th:text="#{trk.within}">Expiring within (days)</label><input type="number" id="days" name="days" min="0" th:value="${days}"></div>
        <div class="field" th:if="${config.modLocations}"><label for="location" th:text="#{loc.location}">Location</label>
            <select id="location" name="location"><option value="" th:text="#{trk.allLocations}">All</option>
                <option th:each="l : ${@locations.active()}" th:value="${l.id}" th:selected="${l.id == location}" th:text="${l.name}">Shop</option></select></div>
        <button class="btn" type="submit" th:text="#{t.show}">Show</button>
    </form>
    <div class="table-wrap"><table class="data">
        <thead><tr><th th:text="#{t.product}">Product</th><th th:text="#{trk.batch}">Batch</th><th th:text="#{trk.expiry}">Expiry date</th>
            <th th:text="#{trk.daysLeft}">Days left</th><th th:text="#{t.quantity}">Quantity</th><th th:if="${config.modLocations}" th:text="#{loc.location}">Location</th></tr></thead>
        <tbody><tr th:each="r : ${rows}" th:classappend="${r.daysLeft() < 0} ? 'trk-expired' : (${r.daysLeft() <= 7} ? 'trk-soon' : '')">
            <td th:text="${r.product()}">p</td><td th:text="${r.batch().batchNo()}">B1</td>
            <td th:text="${#temporals.format(r.batch().expiry(), 'dd/MM/yyyy')}">d</td>
            <td><b th:text="${r.daysLeft() < 0} ? #{trk.expired} : ${r.daysLeft()}">5</b></td>
            <td class="num" th:text="${r.batch().quantity()} + ' ' + ${r.unit()}">3</td>
            <td th:if="${config.modLocations}" th:text="${@locations.name(r.locationId())}">Shop</td></tr></tbody>
    </table><div class="empty" th:if="${#lists.isEmpty(rows)}" th:text="#{trk.noneExpiring}">Nothing expires in this period.</div></div>
</main>
<script th:replace="~{fragments/layout :: menu-script}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
