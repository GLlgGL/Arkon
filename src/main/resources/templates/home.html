<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(#{home.title})}"></head>
<body class="home-body">
<header th:replace="~{fragments/layout :: nav('home')}"></header>
<main class="page">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="home-center">

    <h1 class="home-title" th:text="#{home.title}">Home</h1>

    <!-- Dashboard strip: what needs attention today -->
    <div class="strip" th:with="st=${strip}">
        <a class="strip-item" th:href="@{/sales}">
            <span class="strip-label" th:text="#{strip.salesToday}">Sales today</span>
            <b th:text="${#numbers.formatDecimal(st.salesToday().valueWithVat(), 1, 'COMMA', 2, 'POINT')} + ' ' + ${config.currency}">0</b>
            <span class="strip-note" th:text="#{strip.orders(${st.salesToday().orders()})}">0 orders</span>
        </a>
        <a class="strip-item" th:classappend="${st.overdueOrders() > 0} ? 'alert'"
           th:href="${currentUser.admin} ? @{/debts/sales} : @{/sales}">
            <span class="strip-label" th:text="#{strip.unpaid}">Unpaid by clients</span>
            <b th:text="${#numbers.formatDecimal(st.unpaidTotal(), 1, 'COMMA', 2, 'POINT')} + ' ' + ${config.currency}">0</b>
            <span class="strip-note" th:text="${st.overdueOrders() > 0} ? #{strip.invoicesOverdue(${st.unpaidOrders()}, ${st.overdueOrders()})} : #{strip.invoices(${st.unpaidOrders()})}">0 invoices</span>
        </a>
        <a class="strip-item" sec:authorize="hasRole('ADMIN')" th:classappend="${st.toRestock() > 0} ? 'warn'"
           th:href="@{/reports/warehouse(mode='supply',margin=0)}">
            <span class="strip-label" th:text="#{strip.restock}">To restock</span>
            <b th:text="${st.toRestock()}">0</b>
            <span class="strip-note" th:text="#{strip.restockNote}">products below their limit</span>
        </a>
        <a class="strip-item" th:href="@{/offers}">
            <span class="strip-label" th:text="#{strip.openOffers}">Open offers</span>
            <b th:text="${st.openOffers()}">0</b>
            <span class="strip-note" th:text="#{strip.openOffersNote}">waiting for an answer</span>
        </a>
    </div>

    <!-- Tiles, as on the original Home.aspx. Admin-only tiles show "(Disabled)" for regular users. -->
    <div class="tiles">
        <a class="tile" th:href="@{/purchases}"><img th:src="@{/img/shopping-bag.png}" alt=""><span th:text="#{tile.purchases}">Purchases</span></a>
        <a class="tile" th:href="@{/sales}"><img th:src="@{/img/sales.png}" alt=""><span th:text="#{tile.sales}">Sales</span></a>
        <a class="tile" th:href="@{/offers}"><img th:src="@{/img/scale.png}" alt=""><span th:text="#{tile.offers}">Offerings</span></a>

        <a class="tile" sec:authorize="hasRole('ADMIN')" th:href="@{/reports/sales}"><img th:src="@{/img/bar-graph.png}" alt=""><span th:text="#{tile.reports}">Reports</span></a>
        <div class="tile disabled" sec:authorize="!hasRole('ADMIN')" aria-disabled="true"><img th:src="@{/img/bar-graph.png}" alt=""><span><th:block th:text="#{tile.reports}">Reports</th:block> <em th:text="#{tile.disabled}">(Disabled)</em></span></div>

        <a class="tile" th:href="@{/invoices/sales}"><img th:src="@{/img/invoice.png}" alt=""><span th:text="#{tile.invoices}">Invoices</span></a>

        <a class="tile" sec:authorize="hasRole('ADMIN')" th:href="@{/statistics}"><img th:src="@{/img/statistics1.png}" alt=""><span th:text="#{tile.statistics}">Statistics</span></a>
        <div class="tile disabled" sec:authorize="!hasRole('ADMIN')" aria-disabled="true"><img th:src="@{/img/statistics1.png}" alt=""><span><th:block th:text="#{tile.statistics}">Statistics</th:block> <em th:text="#{tile.disabled}">(Disabled)</em></span></div>

        <a class="tile" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/clients}"><img th:src="@{/img/gear.png}" alt=""><span th:text="#{tile.administration}">Administration</span></a>
        <div class="tile disabled" sec:authorize="!hasRole('ADMIN')" aria-disabled="true"><img th:src="@{/img/gear.png}" alt=""><span><th:block th:text="#{tile.administration}">Administration</th:block> <em th:text="#{tile.disabled}">(Disabled)</em></span></div>

        <a class="tile" sec:authorize="hasRole('ADMIN')" th:href="@{/classes}"><img th:src="@{/img/management.png}" alt=""><span th:text="#{tile.classes}">Classes</span></a>
        <div class="tile disabled" sec:authorize="!hasRole('ADMIN')" aria-disabled="true"><img th:src="@{/img/management.png}" alt=""><span><th:block th:text="#{tile.classes}">Classes</th:block> <em th:text="#{tile.disabled}">(Disabled)</em></span></div>
    </div>
    </div>
</main>
<script th:replace="~{fragments/layout :: menu-script}"></script>
</body>
</html>
