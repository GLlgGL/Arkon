<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{pr.tab.employees})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('more')}"></header>
<main class="page" th:with="cur=' ' + ${config.currency}">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="page-head"><div><h1 th:text="#{pr.tab.employees}">Employees</h1></div></div>
    <div class="table-wrap"><table class="data">
        <thead><tr><th th:text="#{t.name}">Name</th><th th:text="#{pr.personalNo}">Personal no.</th><th th:text="#{pr.position}">Position</th><th th:text="#{pr.gross}">Gross</th>
            <th th:text="#{pr.start}">Start</th><th th:text="#{t.status}">Status</th><th><span class="visually-hidden">Actions</span></th></tr></thead>
        <tbody><tr th:each="e : ${employees}">
            <td><b th:text="${e.name}">n</b></td><td th:text="${e.personalNo}">no</td><td th:text="${e.position}">pos</td><td th:text="${#numbers.formatDecimal(e.grossSalary, 1, 'COMMA', 2, 'POINT')}">0</td>
            <td th:text="${#temporals.format(e.startDate, 'dd/MM/yyyy')}">d</td><td th:text="${e.active} ? #{cash.active} : #{cash.inactive}">Active</td>
            <td><div class="actions"><a class="btn ghost small" th:href="@{/payroll/employees(edit=${e.id})}" th:text="#{t.edit}">Edit</a>
                <form class="inline" method="post" th:action="@{/payroll/employees/{id}/delete(id=${e.id})}" th:attr="data-confirm=#{pr.deleteEmployee}"><button class="btn danger small" type="submit"><img class="ico" th:src="@{/img/delete.png}" alt=""><th:block th:text="#{t.delete}">Delete</th:block></button></form></div></td></tr></tbody>
    </table><div class="empty" th:if="${#lists.isEmpty(employees)}" th:text="#{pr.noEmployees}">No employees yet.</div></div>
    <form class="panel narrow" style="margin-top:1.25rem" method="post" th:action="@{/payroll/employees}">
        <h2 th:text="${editing == null} ? #{pr.addEmployee} : #{pr.editEmployee}">Add an employee</h2>
        <input type="hidden" name="id" th:if="${editing != null}" th:value="${editing.id}">
        <div class="form-row"><div class="field"><label for="name" th:text="#{t.name}">Name</label><input type="text" id="name" name="name" maxlength="150" required th:value="${editing?.name}"></div>
            <div class="field"><label for="personalNo" th:text="#{pr.personalNo}">Personal no.</label><input type="text" id="personalNo" name="personalNo" maxlength="30" th:value="${editing?.personalNo}"></div></div>
        <div class="form-row"><div class="field"><label for="position" th:text="#{pr.position}">Position</label><input type="text" id="position" name="position" maxlength="100" th:value="${editing?.position}"></div>
            <div class="field"><label for="grossSalary" th:text="#{pr.grossMonthly}">Gross salary per month</label><input type="number" id="grossSalary" name="grossSalary" step="0.01" min="0" required th:value="${editing?.grossSalary}"></div></div>
        <div class="form-row"><div class="field"><label for="startDate" th:text="#{pr.start}">Start</label><input type="date" id="startDate" name="startDate" required th:value="${editing != null ? editing.startDate : today}"></div>
            <div class="field"><label for="endDate" th:text="#{pr.end}">End (if left)</label><input type="date" id="endDate" name="endDate" th:value="${editing?.endDate}"></div></div>
        <div class="form-row"><div class="field"><label for="iban">IBAN</label><input type="text" id="iban" name="iban" maxlength="50" th:value="${editing?.iban}" th:placeholder="#{t.optional}"></div>
            <div class="field" th:if="${costCenters != null}"><label for="costCenterId" th:text="#{cc.costCenter}">Cost centre</label>
                <select id="costCenterId" name="costCenterId"><option value="" th:text="#{cc.none}">No cost centre</option>
                    <option th:each="c : ${costCenters}" th:value="${c.id}" th:selected="${editing != null and editing.costCenterId == c.id}" th:text="${c.label}">CC</option></select></div></div>
        <div class="form-row">
            <div class="field"><label for="taxCode" th:text="#{pr.taxCode}">Code at the tax office</label>
                <select id="taxCode" name="taxCode">
                    <option value="001" th:selected="${editing == null or editing.taxCode == '001'}" th:text="#{pr.code001}">001 – full time</option>
                    <option value="002" th:selected="${editing != null and editing.taxCode == '002'}" th:text="#{pr.code002}">002 – part time</option>
                </select></div>
            <label class="check-row"><input type="checkbox" id="declared" name="declared" value="true" th:checked="${editing == null or editing.declared}">
                <span><th:block th:text="#{pr.declared}">Has filed the yearly declaration</th:block> <span class="muted" th:text="'– ' + #{pr.declaredHint}">gives the tax allowance</span></span></label>
        </div>
        <div class="form-row net-gross">
            <div class="field"><label for="wantNet" th:text="#{pr.wantNet}">Net wanted</label><input type="number" id="wantNet" step="0.01" min="0"></div>
            <button type="button" class="btn ghost" id="calcGross" th:attr="data-url=@{/payroll/gross-from-net}" th:text="#{pr.calcGross}">Calculate gross</button>
            <span class="hint" id="calcGrossOut" aria-live="polite"></span>
        </div>
        <label class="check-row"><input type="checkbox" name="active" value="true" th:checked="${editing == null or editing.active}"> <th:block th:text="#{cash.active}">Active</th:block></label>
        <div class="form-actions"><button class="btn" type="submit" th:text="#{t.save}">Save</button><a class="btn ghost" th:if="${editing != null}" th:href="@{/payroll/employees}" th:text="#{t.cancel}">Cancel</a></div>
    </form>
</main>
<script th:replace="~{fragments/layout :: menu-script}"></script>
<script th:src="@{/js/common.js}"></script>
<script th:inline="javascript">
(function () {
  var btn = document.getElementById('calcGross');
  if (!btn) return;
  var out = document.getElementById('calcGrossOut'), fmt = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var txt = /*[[#{pr.grossResult}]]*/ 'Gross {0}: net {1}, TAP {2}';
  btn.addEventListener('click', function () {
    var net = document.getElementById('wantNet').value;
    if (!net) return;
    var q = new URLSearchParams({ net: net, taxCode: document.getElementById('taxCode').value, declared: document.getElementById('declared').checked });
    fetch(btn.dataset.url + '?' + q, { headers: { 'Accept': 'application/json' } }).then(function (r) { return r.json(); }).then(function (r) {
      document.getElementById('grossSalary').value = r.gross;
      out.textContent = txt.replace('{0}', fmt.format(r.gross)).replace('{1}', fmt.format(r.net)).replace('{2}', fmt.format(r.tax));
    });
  });
})();
</script>
</body>
</html>
