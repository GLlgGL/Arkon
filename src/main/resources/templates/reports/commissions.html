<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{com.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('reports')}"></header>
<main class="page" th:with="cur=' ' + ${config.currency}">
    <div class="page-head"><div><h1 th:text="#{com.title}">Sales commissions</h1><p class="sub" th:text="#{com.sub}">sub</p></div>
        <div class="actions"><a class="btn ghost" th:href="@{/reports/commissions/export(from=${from},to=${to},paidOnly=${paidOnly})}"><img class="ico" th:src="@{/img/xls_icon.png}" alt=""><th:block th:text="#{t.export_to_excel}">Export</th:block></a>
            <button class="btn ghost" type="button" onclick="window.print()" th:text="#{t.print}">Print</button></div></div>
    <form class="filters no-print" method="get" th:action="@{/reports/commissions}">
        <div class="field"><label for="from" th:text="#{t.from}">From</label><input type="date" id="from" name="from" th:value="${from}"></div>
        <div class="field"><label for="to" th:text="#{t.to}">To</label><input type="date" id="to" name="to" th:value="${to}"></div>
        <label class="check-row"><input type="checkbox" name="paidOnly" value="true" th:checked="${paidOnly}"> <th:block th:text="#{com.paidOnly}">Only fully paid sales</th:block></label>
        <button class="btn" type="submit" th:text="#{t.show}">Show</button>
    </form>
    <div class="figures">
        <div class="figure"><h3 th:text="#{com.noVat}">Sales without VAT</h3><dl><dt></dt><dd th:text="${#numbers.formatDecimal(rep.noVat(), 1, 'COMMA', 2, 'POINT')} + ${cur}">0</dd></dl></div>
        <div class="figure"><h3 th:text="#{com.profit}">Profit</h3><dl><dt></dt><dd th:text="${#numbers.formatDecimal(rep.profit(), 1, 'COMMA', 2, 'POINT')} + ${cur}">0</dd></dl></div>
        <div class="figure selected"><h3 th:text="#{com.commission}">Commissions</h3><dl><dt></dt><dd class="total" th:text="${#numbers.formatDecimal(rep.commission(), 1, 'COMMA', 2, 'POINT')} + ${cur}">0</dd></dl></div>
    </div>
    <div class="table-wrap"><table class="data">
        <thead><tr><th th:text="#{com.user}">Salesperson</th><th th:text="#{com.sales}">Sales</th><th th:text="#{com.noVat}">Sales without VAT</th><th th:text="#{com.cost}">Cost</th>
            <th th:text="#{com.profit}">Profit</th><th th:text="#{com.base}">On</th><th>%</th><th th:text="#{com.commission}">Commission</th></tr></thead>
        <tbody><tr th:each="r : ${rep.rows()}">
            <td><b th:text="${r.user()}">u</b></td><td class="num" th:text="${r.sales()}">0</td>
            <td class="num" th:text="${#numbers.formatDecimal(r.noVat(), 1, 'COMMA', 2, 'POINT')}">0</td><td class="num" th:text="${#numbers.formatDecimal(r.cost(), 1, 'COMMA', 2, 'POINT')}">0</td>
            <td class="num" th:classappend="${r.profit().signum() < 0} ? 'neg'" th:text="${#numbers.formatDecimal(r.profit(), 1, 'COMMA', 2, 'POINT')}">0</td>
            <td th:text="#{com.base.__${r.base()}__}">Sales</td>
            <td class="num" th:text="${r.pct() == null} ? '–' : ${r.pct().stripTrailingZeros().toPlainString()}">5</td>
            <td class="num"><b th:text="${#numbers.formatDecimal(r.commission(), 1, 'COMMA', 2, 'POINT')}">0</b></td></tr></tbody>
        <tfoot><tr><td colspan="2" th:text="#{t.total}">Total</td><td class="num" th:text="${#numbers.formatDecimal(rep.noVat(), 1, 'COMMA', 2, 'POINT')}">0</td><td></td>
            <td class="num" th:text="${#numbers.formatDecimal(rep.profit(), 1, 'COMMA', 2, 'POINT')}">0</td><td></td><td></td><td class="num amt-total" th:text="${#numbers.formatDecimal(rep.commission(), 1, 'COMMA', 2, 'POINT')}">0</td></tr></tfoot>
    </table><div class="empty" th:if="${#lists.isEmpty(rep.rows())}" th:text="#{com.none}">No sales in this period.</div></div>
    <p class="hint" th:text="#{com.hint}">hint</p>
</main>
<script th:replace="~{fragments/layout :: menu-script}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
