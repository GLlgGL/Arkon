<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Arkon">
  <defs>
    <linearGradient id="arim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#d98600"/>
    </linearGradient>
    <linearGradient id="abody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a6bb3"/>
      <stop offset="1" stop-color="#0a3d69"/>
    </linearGradient>
    <linearGradient id="akey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9800"/>
    </linearGradient>
    <linearGradient id="aleg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6f1"/>
    </linearGradient>
  </defs>
  <!-- bevelled tile: amber rim, navy body, soft top light -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#arim)"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="12.8" fill="url(#abody)"/>
  <path d="M7 17 C7 9.5 11 6.5 18 6.5 H46 C53 6.5 57 9.5 57 17 C46 21 18 21 7 17 Z" fill="#ffffff" fill-opacity=".10"/>
  <!-- the A: two pillars and a crossbar -->
  <g fill="none" stroke="url(#aleg)" stroke-width="8.6" stroke-linecap="butt">
    <path d="M18.2 51 L29.6 19.5"/>
    <path d="M45.8 51 L34.4 19.5"/>
  </g>
  <rect x="22.6" y="34.6" width="18.8" height="5.4" fill="#ffffff"/>
  <!-- the keystone that holds it together -->
  <path d="M25.2 9.2 H38.8 L35.4 22.4 H28.6 Z" fill="url(#akey)" stroke="#9a5a00" stroke-opacity=".55" stroke-width=".9" stroke-linejoin="round"/>
  <path d="M26.6 10.4 H37.4 L36.9 12.3 H27.1 Z" fill="#ffffff" fill-opacity=".45"/>
</svg>
