# Replaces Web.config. Override any value with environment variables,
# e.g. SPRING_DATASOURCE_URL, SPRING_DATASOURCE_PASSWORD, FMS_STORAGE_DIR.
spring:
  application:
    name: financial-management-system

  datasource:
    # Oracle thin driver. Format: jdbc:oracle:thin:@//HOST:PORT/SERVICE_NAME
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:INVENTORY}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. "validate" is avoided because Hibernate's
      # validator rejects some valid Oracle mappings (NUMBER(1) to int, CHAR(1)).
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  thymeleaf:
    cache: true
    servlet:
      # Build each page completely before sending it. Otherwise a large page
      # (like login, with icons and translations) is partly sent before the
      # form, and the security token for the form can no longer create a
      # session: the login page then failed right after logging out.
      produce-partial-output-while-processing: false

  messages:
    basename: messages
    encoding: UTF-8
    # English unless the user picked Albanian; never the server's own language.
    fallback-to-system-locale: false

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 60m
  error:
    include-stacktrace: never

fms:
  # Where invoice PDFs and the invoice logo are written.
  # Replaces the ~/InvoicesPrint/... and ~/Logo/ folders inside the IIS site.
  storage-dir: ${FMS_STORAGE_DIR:./data}

logging:
  level:
    com.fms: INFO
